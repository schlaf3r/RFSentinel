# Builds the FOSS debug APK (installs next to the store app as com.rfsentinel.app.debug)
# on every push, or by hand from the Actions tab. The APK is under the run's Artifacts.
name: Build APK (WiGLE log)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The runner image has the Android SDK (ANDROID_HOME); Gradle fetches any missing platform itself.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit tests (WiGLE CSV format)
        run: ./gradlew --no-daemon testFossDebugUnitTest --tests 'com.rfsentinel.app.util.WigleCsvTest' --tests 'com.rfsentinel.app.sense.CsiMotionTest'
      - name: Build FOSS debug APK
        run: ./gradlew --no-daemon assembleFossDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RFSentinel-foss-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
